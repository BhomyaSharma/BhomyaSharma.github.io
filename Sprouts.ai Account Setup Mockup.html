<meta charset="UTF-8" />
<title>Sprouts.ai — Account Setup</title>
<style>
  :root {
    --bg: #0A0A12;
    --bg-2: #0E0E18;
    --surface: rgba(255,255,255,0.045);
    --surface-solid: #15141F;
    --surface-2: rgba(255,255,255,0.065);
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.20);
    --text: #F3F1FA;
    --text-muted: #ACA8C2;
    --text-faint: #746F8F;
    --accent: #8B7CFF;
    --accent-2: #34E0B0;
    --accent-contrast: #0A0A12;
    --success: #3ED7A0;
    --warning: #F5B04D;
    --critical: #FB7C87;
    --glow-1: rgba(139,124,255,0.32);
    --glow-2: rgba(52,224,176,0.20);
    --glow-3: rgba(255,110,196,0.20);
    --shadow: 0 30px 70px -26px rgba(0,0,0,0.65);
    --radius: 20px;
    --font-display: "Neue Haas Grotesk Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  /* Dark is the deliberate default identity for this flow, regardless of system preference.
     Light is available only via an explicit in-app toggle (data-theme="light" below). */
  :root[data-theme="dark"] {
    --bg: #0A0A12; --bg-2: #0E0E18; --surface: rgba(255,255,255,0.045); --surface-solid: #15141F; --surface-2: rgba(255,255,255,0.065);
    --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.20); --text: #F3F1FA; --text-muted: #ACA8C2; --text-faint: #746F8F;
    --accent: #8B7CFF; --accent-2: #34E0B0; --accent-contrast: #0A0A12;
    --success: #3ED7A0; --warning: #F5B04D; --critical: #FB7C87;
    --glow-1: rgba(139,124,255,0.32); --glow-2: rgba(52,224,176,0.20); --glow-3: rgba(255,110,196,0.20);
    --shadow: 0 30px 70px -26px rgba(0,0,0,0.65);
  }
  :root[data-theme="light"] {
    --bg: #F4F2FB; --bg-2: #EFEDF9; --surface: #FFFFFF; --surface-solid: #FFFFFF; --surface-2: #F3F1FB;
    --border: #E3DFF3; --border-strong: #CFC9EB; --text: #191730; --text-muted: #5B5678; --text-faint: #8B85A8;
    --accent: #5B4FE0; --accent-2: #0E9A73; --accent-contrast: #FFFFFF;
    --success: #158F63; --warning: #A1701D; --critical: #B23B2E;
    --glow-1: rgba(91,79,224,0.14); --glow-2: rgba(14,154,115,0.10); --glow-3: rgba(224,79,180,0.10);
    --shadow: 0 20px 50px -24px rgba(25,23,48,0.18);
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  html, body { height: 100%; margin: 0; }

  .swc-root {
    position: relative;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(1200px 800px at 20% 0%, var(--bg-2), var(--bg));
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .swc-canvas { position: absolute; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .swc-scangrid { position: absolute; inset: -60px; opacity: 0.28;
    background-image: radial-gradient(circle, rgba(255,255,255,0.09) 1px, transparent 1px);
    background-size: 30px 30px; animation: swcGridPan 40s linear infinite; }
  .swc-glow { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
  .swc-glow.g1 { width: 56vw; height: 56vw; top: -16%; left: -12%; background: radial-gradient(circle, var(--glow-1) 0%, transparent 68%); filter: blur(86px); animation: swcAurora1 26s ease-in-out infinite; }
  .swc-glow.g2 { width: 50vw; height: 50vw; bottom: -18%; right: -10%; background: radial-gradient(circle, var(--glow-2) 0%, transparent 68%); filter: blur(86px); animation: swcAurora2 31s ease-in-out infinite; }
  .swc-glow.g3 { width: 42vw; height: 42vw; top: 26%; left: 54%; background: radial-gradient(circle, var(--glow-3) 0%, transparent 68%); filter: blur(80px); animation: swcAurora3 23s ease-in-out infinite; }
  .swc-glow.g4 { width: 30vw; height: 30vw; top: 62%; left: 8%; background: radial-gradient(circle, var(--glow-2) 0%, transparent 68%); filter: blur(70px); opacity: 0.7; animation: swcAurora4 28s ease-in-out infinite; }
  @keyframes swcAurora1 {
    0%, 100% { transform: translate(0,0) scale(1); }
    30% { transform: translate(6%,9%) scale(1.1); }
    60% { transform: translate(11%,-3%) scale(1.02); }
    85% { transform: translate(3%,-8%) scale(1.14); }
  }
  @keyframes swcAurora2 {
    0%, 100% { transform: translate(0,0) scale(1); }
    35% { transform: translate(-8%,-7%) scale(1.12); }
    65% { transform: translate(-3%,6%) scale(1.04); }
    88% { transform: translate(-10%,2%) scale(1.1); }
  }
  @keyframes swcAurora3 {
    0%, 100% { transform: translate(0,0) scale(1); }
    28% { transform: translate(-7%,6%) scale(1.08); }
    58% { transform: translate(-2%,-9%) scale(1.16); }
    82% { transform: translate(6%,3%) scale(1); }
  }
  @keyframes swcAurora4 {
    0%, 100% { transform: translate(0,0) scale(1); }
    40% { transform: translate(7%,-6%) scale(1.15); }
    75% { transform: translate(-4%,5%) scale(0.95); }
  }
  @keyframes swcGridPan { from { background-position: 0 0; } to { background-position: 300px 300px; } }
  #swcParticleCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .swc-shell { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }

  .swc-hdr { display: flex; align-items: center; gap: 16px; padding: 22px 28px; flex: none; }
  .swc-brand { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .swc-brand span { color: var(--text-faint); font-weight: 500; }
  .swc-hdr-spacer { flex: 1; }
  .swc-credits { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px 6px 11px; background: var(--surface); }
  .swc-credits b { font-family: var(--font-mono); color: var(--accent-2); font-weight: 700; }
  .swc-credits.swc-pop { animation: swcPop 0.5s ease; }
  @keyframes swcPop { 0% { transform: scale(1); } 35% { transform: scale(1.12); box-shadow: 0 0 0 6px var(--glow-2); } 100% { transform: scale(1); box-shadow: none; } }
  .swc-exit { font-size: 12.5px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px;
    background: var(--surface); cursor: pointer; font-family: var(--font-body); }
  .swc-exit:hover { border-color: var(--border-strong); color: var(--text); }

  .swc-dots { display: flex; align-items: center; gap: 7px; }
  .swc-dot { border: none; cursor: pointer; padding: 0; background: var(--border-strong); border-radius: 999px;
    width: 8px; height: 8px; transition: width 0.3s ease, background 0.3s ease, opacity 0.2s ease; }
  .swc-dot:hover { opacity: 0.8; }
  .swc-dot.is-current { width: 26px; background: var(--accent); box-shadow: 0 0 12px var(--glow-1); }
  .swc-dot.is-done { background: var(--accent-2); }

  .swc-stagewrap { flex: 1; min-height: 0; overflow-y: auto; display: flex; align-items: flex-start; justify-content: center; padding: 20px 24px 60px; }
  .swc-stage { width: 100%; max-width: 660px; margin-top: clamp(8px, 4vh, 56px); }

  .swc-panel {
    position: relative; background: var(--surface-solid); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 38px 42px; box-shadow: var(--shadow); overflow: hidden;
    animation: swcPanelIn 0.42s cubic-bezier(.2,.8,.2,1) both;
  }
  @supports (backdrop-filter: blur(1px)) {
    .swc-panel { background: var(--surface); backdrop-filter: blur(28px) saturate(160%); }
  }
  @keyframes swcPanelIn { from { opacity: 0; transform: translateY(14px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @media (max-width: 640px) { .swc-panel { padding: 28px 22px; } }

  .swc-panel-icon { width: 46px; height: 46px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
  .swc-panel-icon svg { width: 23px; height: 23px; }
  .swc-h1 { font-family: var(--font-display); font-size: 27px; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
  .swc-h1-sub { font-size: 14px; color: var(--text-muted); margin-top: 8px; max-width: 52ch; line-height: 1.55; }
  .swc-optional-tag { display: inline-block; margin-top: 10px; font-size: 11px; letter-spacing: 0.04em; color: var(--warning);
    border: 1px solid color-mix(in srgb, var(--warning) 55%, transparent); background: color-mix(in srgb, var(--warning) 14%, transparent);
    border-radius: 999px; padding: 3px 10px; }

  .swc-section { margin-top: 28px; }
  .swc-section-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); margin-bottom: 11px; }

  .swc-fieldrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .swc-fieldrow { grid-template-columns: 1fr; } }
  .swc-field-label { font-size: 12px; color: var(--text-faint); margin-bottom: 6px; display: block; }
  .swc-input, .swc-textarea {
    width: 100%; font-family: var(--font-body); font-size: 14px; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .swc-input::placeholder, .swc-textarea::placeholder { color: var(--text-faint); }
  .swc-input:focus, .swc-textarea:focus, button:focus-visible {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow-1);
  }
  .swc-textarea { resize: vertical; min-height: 56px; line-height: 1.5; }

  .swc-chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .swc-chip-opt {
    font-family: var(--font-body); font-size: 13px; padding: 9px 15px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer;
    transition: transform 0.1s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .swc-chip-opt:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .swc-chip-opt:active { transform: scale(0.96); }
  .swc-chip-opt.is-selected { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); box-shadow: 0 0 18px var(--glow-1); }

  .swc-btnrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 22px; }
  .swc-btn {
    font-family: var(--font-body); font-size: 13.5px; font-weight: 600; padding: 11px 18px; border-radius: 11px;
    border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; transition: background 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;
  }
  .swc-btn:hover { border-color: var(--border-strong); box-shadow: 0 6px 20px -10px rgba(0,0,0,0.4); transform: translateY(-1px); }
  .swc-btn:active { transform: translateY(0); }
  .swc-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); box-shadow: 0 0 24px var(--glow-1); }
  .swc-btn.primary:hover { filter: brightness(1.08); }
  .swc-btn.ghost { border-color: transparent; background: none; color: var(--text-muted); padding-left: 4px; padding-right: 4px; box-shadow: none; }
  .swc-btn.ghost:hover { color: var(--text); text-decoration: underline; box-shadow: none; transform: none; }
  .swc-btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .swc-btn.pulse { animation: swcBtnPulse 2.2s ease-in-out infinite; }
  @keyframes swcBtnPulse { 0%,100% { box-shadow: 0 0 0 0 var(--glow-1); } 50% { box-shadow: 0 0 0 10px transparent; } }

  .swc-navrow { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
  .swc-navrow .swc-btn.ghost { font-size: 13px; }

  /* ---------- chat-style agent builder ---------- */
  .swc-chat { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
  .swc-msg { display: flex; gap: 11px; max-width: 92%; animation: swcMsgIn 0.3s ease both; }
  @keyframes swcMsgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .swc-msg.from-user { align-self: flex-end; flex-direction: row-reverse; }
  .swc-msg-avatar { width: 30px; height: 30px; border-radius: 9px; flex: none; display: flex; align-items: center; justify-content: center; }
  .swc-msg.from-cortex .swc-msg-avatar { background: var(--surface-2); color: var(--accent); border: 1px solid var(--border); }
  .swc-msg.from-user .swc-msg-avatar { background: var(--accent); color: var(--accent-contrast); }
  .swc-msg-avatar svg { width: 16px; height: 16px; }
  .swc-bubble { border-radius: 14px; padding: 12px 15px; font-size: 13.5px; line-height: 1.55; }
  .swc-msg.from-cortex .swc-bubble { background: var(--surface-2); border: 1px solid var(--border); border-top-left-radius: 4px; color: var(--text); }
  .swc-msg.from-user .swc-bubble { background: var(--accent); color: var(--accent-contrast); border-top-right-radius: 4px; }
  .swc-typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
  .swc-typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); animation: swcBounce 1s ease-in-out infinite; }
  .swc-typing span:nth-child(2) { animation-delay: 0.15s; }
  .swc-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes swcBounce { 0%, 80%, 100% { opacity: 0.3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  .swc-chatinput { display: flex; gap: 8px; align-items: flex-end; margin-top: 6px; }
  .swc-chatinput .swc-textarea { min-height: 46px; }
  .swc-sendbtn { flex: none; width: 44px; height: 44px; border-radius: 11px; background: var(--accent); color: var(--accent-contrast);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: filter 0.15s ease; }
  .swc-sendbtn:hover { filter: brightness(1.08); }
  .swc-sendbtn svg { width: 18px; height: 18px; }
  .swc-agentname-inline { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.08); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 3px 8px; margin: 6px 0; }
  .swc-agentname-inline input { background: none; border: none; color: inherit; font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; width: 170px; }
  .swc-agentname-inline input:focus { outline: none; }

  .swc-reasoning-bubble { padding: 10px 13px; }
  .swc-reasoning-toggle { background: none; border: none; cursor: pointer; color: var(--text-faint); font-size: 11px; font-family: var(--font-body);
    display: flex; align-items: center; gap: 6px; padding: 0; text-transform: uppercase; letter-spacing: 0.06em; }
  .swc-reasoning-toggle:hover { color: var(--text-muted); }
  .swc-reasoning-toggle .chev { font-size: 13px; width: 10px; display: inline-block; }
  .swc-reasoning-text { margin-top: 9px; font-size: 12.5px; color: var(--text-muted); line-height: 1.65; }

  .swc-safetynote { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px; }
  .swc-safetyline { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; align-items: flex-start; }
  .swc-safetyline .mark { flex: none; font-weight: 700; line-height: 1.5; }
  .swc-safetyline.good .mark { color: var(--accent-2); }
  .swc-safetyline.caution .mark { color: var(--text-faint); }

  .swc-pill-paused { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; padding: 5px 11px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--warning) 55%, transparent); background: color-mix(in srgb, var(--warning) 14%, transparent);
    color: var(--warning); white-space: nowrap; }
  .swc-pill-paused::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warning); flex: none; }

  .swc-pill-active { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; padding: 5px 11px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent-2) 55%, transparent); background: color-mix(in srgb, var(--accent-2) 14%, transparent);
    color: var(--accent-2); white-space: nowrap; }
  .swc-pill-active::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); flex: none; }

  .swc-breadcrumb { font-size: 11.5px; color: var(--text-faint); margin-bottom: 10px; }
  .swc-breadcrumb .sep { margin: 0 6px; color: var(--border-strong); }

  .swc-sample-tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--warning); margin-bottom: 11px; font-weight: 700; }
  .swc-resultcard.swc-sample-preview { border-style: dashed; border-color: var(--border-strong); background: color-mix(in srgb, var(--surface-2) 70%, transparent); }

  /* ---------- match / value stage ---------- */
  .swc-radarwrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 18px 0 6px; }
  .swc-radar { position: relative; width: 68px; height: 68px; }
  .swc-radar span { position: absolute; inset: 0; border: 2px solid var(--accent); border-radius: 50%; opacity: 0; animation: swcPing 1.7s ease-out infinite; }
  .swc-radar span:nth-child(2) { animation-delay: 0.55s; }
  .swc-radar span:nth-child(3) { animation-delay: 1.1s; }
  .swc-radar .swc-radar-core { position: absolute; inset: 22px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 20px var(--glow-1); }
  @keyframes swcPing { 0% { transform: scale(0.4); opacity: 0.75; } 100% { transform: scale(1.9); opacity: 0; } }
  .swc-searchcap { font-size: 13px; color: var(--text-muted); }

  .swc-resultcard { border: 1px solid var(--border-strong); border-radius: 15px; padding: 18px; background: var(--surface-2); margin-top: 8px; }
  .swc-resultcard.is-fresh { animation: swcGlow 1.3s ease; }
  @keyframes swcGlow { 0% { box-shadow: 0 0 0 0 var(--glow-1); } 65% { box-shadow: 0 0 0 18px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .swc-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: var(--accent-contrast);
    display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; flex: none; }
  .swc-result-head { display: flex; gap: 12px; align-items: center; }
  .swc-result-name { font-size: 15px; font-weight: 700; }
  .swc-result-role { font-size: 12.5px; color: var(--text-muted); margin-top: 1px; }
  .swc-confidence { margin-left: auto; text-align: right; }
  .swc-confidence .num { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--accent-2); }
  .swc-confidence .lbl { font-size: 10.5px; color: var(--text-faint); }
  .swc-whyline { font-size: 12.5px; color: var(--text-muted); border-left: 2px solid var(--accent); padding-left: 10px; margin-top: 13px; }

  .swc-matchline { display: flex; align-items: baseline; gap: 9px; margin-top: 6px; }
  .swc-matchnum { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--accent-2); font-variant-numeric: tabular-nums; }
  .swc-matchof { font-size: 12px; color: var(--text-faint); }

  .swc-stage.is-wide { max-width: 860px; }

  /* ---------- account/contact explorer ---------- */

  .swc-explorecard { border: 1px solid var(--border); border-radius: 15px; padding: 18px; background: var(--surface-2); margin-top: 14px; }
  .swc-mini-kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; margin-top: 14px; }
  .swc-mini-kv .k { font-size: 10.5px; color: var(--text-faint); }
  .swc-mini-kv .v { font-size: 13px; color: var(--text); margin-top: 2px; font-weight: 600; }

  .swc-sparkline { display: flex; align-items: flex-end; gap: 2px; height: 22px; }
  .swc-sparkline span { width: 5px; background: var(--accent-2); border-radius: 1.5px; opacity: 0.85; display: block; }

  .swc-hiringlist { margin-top: 6px; }
  .swc-hiringitem { font-size: 12.5px; color: var(--text-muted); padding: 4px 0; }

  .swc-orgchart { display: flex; flex-direction: column; align-items: center; gap: 22px; margin-top: 18px; padding-top: 4px; }
  .swc-org-tier { display: flex; gap: 20px; }
  .swc-org-node { position: relative; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 10px; padding: 9px 14px;
    text-align: center; min-width: 118px; margin: 0; font-family: inherit; color: inherit; }
  .swc-org-node::before { content: ""; position: absolute; top: -22px; left: 50%; width: 1px; height: 22px; background: var(--border-strong); }

                  (state.agentSaved ? '<span class="swc-pill-paused">Paused — reviewing matches, nothing sent yet</span>' : "") +
                  '<button class="swc-btn ghost" id="swcEditIcp">Change my answer</button></div>' +
              '</div></div>';
          }
        }
      } else {
        chatHtml += '<div class="swc-chatinput">' +
          '<textarea class="swc-textarea" id="swcIcpText" placeholder="e.g. Series B+ SaaS companies, 500+ employees, hiring for RevOps, already on Salesforce...">' + state.icpDraft + '</textarea>' +
          '<button class="swc-sendbtn" id="swcSendIcp" aria-label="Send">' + ICONS.send + '</button>' +
        '</div>' +
        '<div class="swc-chiprow" id="swcIcpChips">' +
          ICP_CHIPS.map(function (c) { return '<button class="swc-chip-opt ' + (state.icpChipsUsed[c] ? "is-selected" : "") + '" data-icpchip="' + c + '">' + c + '</button>'; }).join("") +
        '</div>';
      }
      chatHtml += '</div>';
      return panelOpen(s, { sub: fn ? ("Ok " + fn + ", chat with Cortex below — rough ideas are fine.") : "Chat with Cortex below — rough ideas are fine." }) +
        chatHtml + navRow() + panelClose();
    },

    value: function () {
      var s = STAGES[3];
      var body;
      if (state.valueSearching) {
        body = '<div class="swc-radarwrap"><div class="swc-radar"><span></span><span></span><span></span><div class="swc-radar-core"></div></div>' +
          '<div class="swc-searchcap">Looking across 43.6M accounts…</div></div>';
      } else if (!state.valueRevealed) {
        body = '<p style="color:var(--text-muted);">Run ' + (state.agentName || "your agent") + ' against live data to see a real result like this.</p>' +
          samplePreviewCardHtml() +
          (state.confirmRunAgent ?
            costConfirmHtml("Running this will use <b>~100 credits</b> to search live data across the account index. You can stop anytime after.", "confirmrun", "cancelrun") :
            '<div class="swc-btnrow"><button class="swc-btn primary pulse" data-askrun="1">Run agent</button></div>');
      } else {
        body = resultsListHtml() + selectedAccountDetailHtml() + agentsLibraryTeaserHtml() + csvImportHtml() + crmInlineHtml();
      }
      return panelOpen(s, { sub: "A real result from " + (state.agentName || "your new agent") + ", ready to use." }) + body + navRow() + panelClose();
    },

    configure: function () {
      var s = STAGES[4];
      var body = section("More settings",
        '<div class="swc-deferlist">' + icpRowHtml() + crmRowHtml() +
        DEFER_ITEMS.map(function (d) {
          return '<div class="swc-defer-row"><div><div class="swc-defer-name">' + d.name + '</div><div class="swc-defer-sub">' + d.sub + '</div></div>' +
            '<button class="swc-btn ghost">Configure →</button></div>';
        }).join("") + '</div>');
      return panelOpen(s, { sub: "Nothing here was required to get your first match — it all stays available.", optional: true }) +
        body + '<p style="margin-top:22px;color:var(--text-muted);">' + closingCopy() + '</p>' + navRow() + panelClose();
    }
  };

  function crmInlineHtml() {
    if (Object.values(state.crm).some(Boolean)) {
      return '<div class="swc-section"><div class="swc-btnrow" style="margin-top:0;"><button class="swc-btn primary" id="swcPushBtn">' +
        (state.pushedToCrm ? "Synced to CRM ✓" : "Push to CRM") + '</button></div>' +
        '<p style="margin-top:10px;color:var(--text-muted);font-size:13px;">Your connected CRM is ready to receive this record.</p></div>';
    }
    if (state.previewOnly) return '<p style="margin-top:16px;color:var(--text-muted);font-size:13px;">Kept as a preview for now — connect a CRM anytime from Explore more.</p>';
    return '<div class="swc-section"><div class="swc-section-label">Keep it in sync</div>' +
      '<p style="margin:0 0 10px;color:var(--text-muted);font-size:13px;">Want this synced automatically next time?</p>' +
      '<div class="swc-btnrow" style="margin-top:0;">' +
        '<button class="swc-btn" data-quickcrm="SF">Connect Salesforce</button>' +
        '<button class="swc-btn" data-quickcrm="HS">Connect HubSpot</button>' +
      '</div>' +
      '<button class="swc-btn ghost" id="swcPreviewOnlyBtn" style="margin-top:6px;">Just preview it for now →</button></div>';
  }
  function icpRowHtml() {
    var name = state.icpName || suggestIcpName();
    return '<div class="swc-defer-row"><div><div class="swc-defer-name">Your ICP</div>' +
        '<div class="swc-defer-sub">' + escapeHtml(name) + ' · Active · you can create and switch between more anytime</div></div>' +
        '<button class="swc-btn ghost">Manage →</button></div>';
  }
  function crmRowHtml() {
    var n = Object.values(state.crm).filter(Boolean).length;
    return '<div class="swc-defer-row"><div><div class="swc-defer-name">Connect your CRM</div>' +
        '<div class="swc-defer-sub">' + (n ? n + " of 5 connected" : "Sync automatically with the tools you use") + '</div></div>' +
        '<button class="swc-btn ghost" id="swcCrmToggle">' + (state.crmGridOpen ? "Hide" : "Manage →") + '</button></div>' +
      (state.crmGridOpen ? '<div class="swc-crmgrid">' + CRMS.map(crmTileHtml).join("") + '</div>' : "");
  }
  function crmTileHtml(c) {
    var on = !!state.crm[c.code];
    return '<div class="swc-crmtile"><div class="swc-crmtile-top"><div class="swc-crm-mono">' + c.code + '</div>' +
      '<div><div class="swc-crm-name">' + c.name + '</div><div class="swc-crm-status ' + (on ? "on" : "") + '">' + (on ? "Connected" : "Not connected") + '</div></div></div>' +
      '<button class="swc-btn" data-crmconnect="' + c.code + '" style="justify-content:center;">' + (on ? "Disconnect" : "Connect") + '</button></div>';
  }
  function samplePreviewCardHtml() {
    return '<div class="swc-resultcard swc-sample-preview">' +
      '<div class="swc-sample-tag">Sample preview — illustrative, not a real result yet</div>' +
      '<div class="swc-result-head"><div class="swc-avatar" style="background:var(--surface-2);color:var(--text-faint);border:1px dashed var(--border-strong);">JA</div>' +
      '<div><div class="swc-result-name">Jordan Alvarez</div><div class="swc-result-role">VP RevOps · Example Co.</div></div>' +
      '<div class="swc-confidence"><div class="num" style="color:var(--text-faint);">~90%</div><div class="lbl">Typical match confidence</div></div></div>' +
      '<div class="swc-whyline" style="border-left-color:var(--border-strong);color:var(--text-faint);">This is the shape of what you&#8217;ll get back — a real company, a real title, and a plain-English reason it matched.</div>' +
    '</div>';
  }
  function costConfirmHtml(text, confirmAttr, cancelAttr, idVal) {
    var v = idVal || "1";
    return '<div class="swc-costconfirm">' +
      '<div class="swc-costconfirm-text">' + text + '</div>' +
      '<div class="swc-btnrow" style="margin-top:10px;">' +
        '<button class="swc-btn primary" data-' + confirmAttr + '="' + v + '">Confirm &amp; run</button>' +
        '<button class="swc-btn ghost" data-' + cancelAttr + '="' + v + '">Cancel</button>' +
      '</div>' +
    '</div>';
  }

  function matchTier(conf) {
    if (conf >= 80) return { label: "Strong match", cls: "is-strong" };
    if (conf >= 65) return { label: "Good match", cls: "is-good" };
    return { label: "Possible match", cls: "is-possible" };
  }
  function resultsListHtml() {
    var totalAssessed = computeMatch();
    return '<div class="swc-section"><div class="swc-section-label">Results</div>' +
      '<p style="margin:0 0 12px;color:var(--text-faint);font-size:12px;">Showing the top ' + RESULT_ACCOUNTS.length + ' of ~' + totalAssessed.toLocaleString() + ' accounts assessed so far.</p>' +
      '<div class="swc-resultslist">' + RESULT_ACCOUNTS.map(accountRowHtml).join("") + '</div>' +
    '</div>';
  }
  function accountRowHtml(a) {
    var isSel = state.selectedAccountId === a.id;
    var tier = matchTier(a.confidence);
    return '<button class="swc-acctrow ' + tier.cls + (isSel ? " is-selected" : "") + '" data-selectacct="' + a.id + '">' +
      '<div class="swc-acctrow-main"><div class="swc-acctrow-name">' + a.name + '</div>' +
        '<div class="swc-acctrow-sub">' + a.industry + ' · ' + a.employees + ' employees · ' + a.hq + '</div></div>' +
      '<div class="swc-acctrow-status ' + tier.cls + '">' + tier.label + '</div>' +
      '<div class="swc-acctrow-conf">' + a.confidence + '%</div>' +
    '</button>';
  }

  function selectedAccountDetailHtml() {
    var a = accountById(state.selectedAccountId);
    return a ? matchedDetailHtml(a) : "";
  }
  function matchedDetailHtml(a) {
    return '<div class="swc-section"><div class="swc-section-label">Explore this account</div>' +
      accountsTabHtml(a) +
    '</div>';
  }

  function accountsTabHtml(a) {
    return '<div class="swc-explorecard">' +
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">' +
        '<div><div style="font-weight:700;font-size:14px;">' + a.name + '</div>' +
        '<div style="font-size:12px;color:var(--text-faint);margin-top:2px;">' + a.industry + '</div></div>' +
        '<div class="swc-confidence" style="margin:0;"><div class="num">' + a.confidence + '%</div><div class="lbl">Match confidence</div></div>' +
      '</div>' +
      '<div class="swc-whyline">' + a.why + '</div>' +
      '<div class="swc-mini-kv">' +
        '<div><div class="k">Employees</div><div class="v">' + a.employees + '</div></div>' +
        '<div><div class="k">HQ</div><div class="v">' + a.hq + '</div></div>' +
        '<div><div class="k">Founded</div><div class="v">' + a.founded + '</div></div>' +
      '</div>' +
      '<div style="margin-top:16px;display:flex;align-items:center;gap:12px;">' +
        '<div class="swc-sparkline">' + a.growthBars.map(function (h) { return '<span style="height:' + (h * 2) + 'px;"></span>'; }).join("") + '</div>' +
        '<div><div style="font-size:13px;color:var(--accent-2);font-weight:700;">' + a.growth + '</div><div style="font-size:11px;color:var(--text-faint);">headcount growth</div></div>' +
      '</div>' +
      '<div class="swc-hiringlist"><div class="swc-field-label" style="margin-top:14px;">Hiring signals</div>' +
        (a.hiring.length ? a.hiring.map(function (h) { return '<div class="swc-hiringitem">• ' + h + '</div>'; }).join("") :
          '<div class="swc-hiringitem" style="color:var(--text-faint);">No open roles detected yet.</div>') +
      '</div>' +
      confidenceBreakdownHtml(a) +
      aiSignalsHtml(a) +
      '<div class="swc-field-label" style="margin-top:20px;">People at this account — pick one to enrich and reach out</div>' +
      orgChartHtml(a) +
      contactDrillHtml(a) +
    '</div>';
  }

  function confidenceBreakdownHtml(a) {
    var open = !!state.confidenceOpen[a.id];
    return '<div class="swc-confbreak">' +
      '<button class="swc-confbreak-toggle" data-confid="' + a.id + '"><span class="swc-confbreak-num">Why ' + a.confidence + '%?</span><span class="chev">' + (open ? "⌄" : "›") + '</span></button>' +
      (open ? '<div class="swc-confbreak-list">' + a.confidenceFactors.map(function (f) {
        return '<div class="swc-confbreak-row"><span>' + f.label + '</span><span class="pct">' + f.pct + '%</span></div>';
      }).join("") + '</div>' : "") +
    '</div>';
  }

  function orgChartHtml(a) {
    return '<div class="swc-orgchart">' + a.org.map(function (tier) {
      return '<div class="swc-org-tier">' + tier.map(function (p) {
        var clickable = !!p.contactId;
        var isSelected = clickable && p.contactId === state.selectedContactId;
        var cls = "swc-org-node" + (p.match ? " is-match" : "") + (isSelected ? " is-selected" : "") + (clickable ? " is-clickable" : "");
        if (clickable) {
          return '<button type="button" class="' + cls + '" data-selectcontact="' + p.contactId + '">' +
            '<div class="swc-org-name">' + p.name + '</div><div class="swc-org-role">' + p.role + '</div>' +
            '<div class="swc-org-hint">' + (isSelected ? "Viewing ↓" : "View contact →") + '</div>' +
          '</button>';
        }
        return '<div class="' + cls + '"><div class="swc-org-name">' + p.name + '</div><div class="swc-org-role">' + p.role + '</div></div>';
      }).join("") + '</div>';
    }).join("") + '</div>';
  }
  function contactDrillHtml(a) {
    var c = (a.contacts || []).filter(function (x) { return x.id === state.selectedContactId; })[0];
    if (!c) return "";
    return '<div class="swc-section" style="margin-top:18px;">' +
      '<div class="swc-breadcrumb">' + a.name + ' <span class="sep">›</span> ' + c.name + '</div>' +
      contactCardHtml(c) +
    '</div>';
  }

  function aiSignalsHtml(a) {
    var id = a.id;
    if (state.signalsConfirm[id]) return costConfirmHtml("Generating fresh AI signals for " + a.name + " will use <b>~15 credits</b>.", "confirmsignals", "cancelsignals", id);
    if (state.signalsGenerating[id]) return '<div class="swc-signalbox"><span class="swc-typing"><span></span><span></span><span></span></span></div>';
    if (state.signalsShown[id]) return '<div class="swc-signalbox">' + a.signals.map(function (sg) { return '<div class="swc-signalitem">' + sg + '</div>'; }).join("") + '</div>';
    return '<div class="swc-btnrow" style="margin-top:16px;"><button class="swc-btn" data-asksignals="' + id + '">Generate AI signals</button></div>';
  }

  function cadenceStepHtml(contact, step, dayLabel) {
    var cid = contact.id, sid = step.id;
    var msgs = state.hpmText[cid] || {}, gens = state.hpmGenerating[cid] || {}, sent = state.outreachSent[cid] || {};
    var shown = !!msgs[sid], loading = !!gens[sid], queued = !!sent[sid];
    return '<div class="swc-cadence-step">' +
      '<div class="swc-cadence-head">' +
        '<div class="swc-cadence-chan">' + (step.channel === "linkedin" ? ICONS.connect : ICONS.mail) + '</div>' +
        '<div class="swc-cadence-label">' + step.label + '</div>' +
        '<div class="swc-cadence-day">' + dayLabel + '</div>' +
      '</div>' +
      '<div class="swc-msgbox swc-cadence-msgbox">' + (loading ? '<span class="swc-typing"><span></span><span></span><span></span></span>' :
        (shown ? escapeHtml(msgs[sid]) : '<span style="color:var(--text-faint);">No message generated yet.</span>')) + '</div>' +
      '<div class="swc-cadence-actions">' +
        '<button class="swc-btn" data-cadgen="1" data-cid="' + cid + '" data-step="' + sid + '">' + (shown ? "Regenerate" : "Generate message") + '</button>' +
        '<button class="swc-btn" data-cadqueue="1" data-cid="' + cid + '" data-step="' + sid + '" ' + (!shown ? "disabled" : "") + '>' + (queued ? "Queued ✓" : "Queue this step") + '</button>' +
      '</div>' +
    '</div>';
  }
  function cadenceGapHtml(cid, gapKey, days) {
    return '<div class="swc-cadence-gap"><span class="swc-gapstepper">' + days + ' day' + (days === 1 ? "" : "s") + ' later' +
        '<button class="swc-gapbtn" data-gapdec="1" data-cid="' + cid + '" data-gapkey="' + gapKey + '" aria-label="Fewer days">▾</button>' +
        '<button class="swc-gapbtn" data-gapinc="1" data-cid="' + cid + '" data-gapkey="' + gapKey + '" aria-label="More days">▴</button>' +
      '</span></div>';
  }
  function cadenceHtml(contact) {
    var cid = contact.id;
    var gapA = (state.cadenceGap[cid] && state.cadenceGap[cid].s1_s2) || 3;
    var gapB = (state.cadenceGap[cid] && state.cadenceGap[cid].s2_s3) || 4;
    var dayA = 0, dayB = gapA, dayC = gapA + gapB;
    var tmpl = state.hpmTemplate[cid] || "intro";
    return '<div class="swc-section" style="margin-top:14px;"><div class="swc-field-label">Outreach cadence</div>' +
      '<div class="swc-chiprow" style="margin-bottom:11px;">' + HPM_TEMPLATES.map(function (t) {
        return '<button class="swc-chip-opt ' + (tmpl === t.id ? "is-selected" : "") + '" data-hpmtmpl="' + t.id + '" data-cid="' + cid + '" style="padding:5px 11px;font-size:12px;">' + t.label + '</button>';
      }).join("") + '</div>' +
      '<div class="swc-cadence">' +
        cadenceStepHtml(contact, CADENCE_STEPS[0], "Day " + dayA) +
        cadenceGapHtml(cid, "s1_s2", gapA) +
        cadenceStepHtml(contact, CADENCE_STEPS[1], "Day " + dayB) +
        cadenceGapHtml(cid, "s2_s3", gapB) +
        cadenceStepHtml(contact, CADENCE_STEPS[2], "Day " + dayC) +
      '</div>' +
    '</div>';
  }
  function contactCardHtml(c) {
    var emailShown = !!state.enrichedEmail[c.id];
    var phoneShown = !!state.enrichedPhone[c.id];
    var maskedEmail = c.email.replace(/^(.)[^@]*(@.*)$/, "$1***$2");
    var maskedPhone = c.phone.replace(/\d(?=(\D*\d){4})/g, "•");
    return '<div class="swc-contact-card" data-contact="' + c.id + '">' +
      '<div class="swc-contact-top"><div class="swc-avatar" style="width:34px;height:34px;font-size:12px;">' + initials(c.name) + '</div>' +
      '<div><div class="swc-contact-name">' + c.name + '</div><div class="swc-contact-title">' + c.title + '</div></div>' +
      '<div class="swc-seniority">' + c.seniority + '</div></div>' +

      '<div class="swc-enrichrow"><span style="font-size:12px;color:var(--text-faint);">Email</span>' +
        '<span>' + (emailShown ? '<span class="swc-enrichval">' + c.email + '</span>' :
          '<span class="swc-enrichval is-masked">' + maskedEmail + '</span> <button class="swc-btn ghost" data-enrich="email" data-cid="' + c.id + '" style="padding:0 0 0 6px;">Enrich</button>') + '</span></div>' +

      '<div class="swc-enrichrow"><span style="font-size:12px;color:var(--text-faint);">Phone</span>' +
        '<span>' + (phoneShown ? '<span class="swc-enrichval">' + c.phone + '</span>' :
          '<span class="swc-enrichval is-masked">' + maskedPhone + '</span> <button class="swc-btn ghost" data-enrich="phone" data-cid="' + c.id + '" style="padding:0 0 0 6px;">Enrich</button>') + '</span></div>' +

      (c.why ? '<div class="swc-contact-why">' + c.why + '</div>' : "") +

      cadenceHtml(c) +
    '</div>';
  }

  function agentsLibraryTeaserHtml() {
    var open = state.agentsLibraryOpen;
    return '<div class="swc-section"><div class="swc-explorecard">' +
      '<div style="display:flex;align-items:center;gap:14px;">' +
        '<div class="swc-panel-icon" style="margin-bottom:0;">' + ICONS.spark + '</div>' +
        '<div style="flex:1;"><div style="font-weight:700;font-size:13.5px;">Prefer to automate all of this?</div>' +
        '<div style="font-size:12.5px;color:var(--text-muted);margin-top:3px;">Enrichment, messaging and outreach can all run on their own once you\'re past setup.</div></div>' +
        '<button class="swc-btn ghost" id="swcAgentsLibToggle" style="white-space:nowrap;">' + (open ? "Hide" : "Explore →") + '</button>' +
      '</div>' +
      (open ? '<div class="swc-agentlib-grid">' + AGENT_LIBRARY.map(agentLibCardHtml).join("") + '</div>' : "") +
    '</div></div>';
  }
  function agentLibCardHtml(a) {
    return '<div class="swc-agentlib-card">' +
      '<div class="swc-panel-icon" style="width:36px;height:36px;margin-bottom:10px;">' + ICONS[a.icon] + '</div>' +
      '<div class="swc-agentlib-name">' + a.name + '</div>' +
      '<div class="swc-agentlib-desc">' + a.desc + '</div>' +
      '<button class="swc-btn ghost" data-uselib="1" style="padding-left:0;margin-top:8px;">Use this agent →</button>' +
    '</div>';
  }

  function csvImportHtml() {
    var csv = state.csv, body;
    if (csv.imported) {
      body = '<div class="swc-csvresult"><span class="mark good">✓</span>Imported and queued for enrichment: <b>' + csv.totalRows + ' rows</b> from <span class="fname">' + escapeHtml(csv.fileName) + '</span>.' +
        '<div><button class="swc-btn ghost" id="swcCsvReset" style="padding-left:0;margin-top:8px;">Import another file →</button></div></div>';
    } else if (csv.importing) {
      body = '<div class="swc-msgbox"><span class="swc-typing"><span></span><span></span><span></span></span> Enriching ' + csv.totalRows + ' rows…</div>';
    } else if (csv.error) {
      body = '<div class="swc-csverror">' + escapeHtml(csv.error) + '</div>' +
        '<label class="swc-dropzone" for="swcCsvInput" style="margin-top:10px;">Try a different file<input type="file" id="swcCsvInput" accept=".csv" /></label>';
    } else if (csv.headers) {
      var needsMore = csv.mapping.accountName === -1 || csv.mapping.email === -1;
      body = '<p style="margin:0 0 10px;color:var(--text-muted);font-size:12.5px;">Detected ' + csv.headers.length + ' columns and ' + csv.rows.length + ' rows in <span class="fname">' + escapeHtml(csv.fileName) + '</span>. Confirm what maps to what:</p>' +
        '<div class="swc-csvmap">' + CSV_FIELDS.map(function (f) {
          var sel = csv.mapping[f.key];
          return '<div class="swc-csvmap-row"><span>' + f.label + '</span><select class="swc-input swc-csvmap-select" data-csvmap="' + f.key + '">' +
            '<option value="-1"' + (sel === -1 ? " selected" : "") + '>— Not mapped —</option>' +
            csv.headers.map(function (h, i) { return '<option value="' + i + '"' + (sel === i ? " selected" : "") + '>' + escapeHtml(h) + '</option>'; }).join("") +
          '</select></div>';
        }).join("") + '</div>' +
        csvPreviewTableHtml(csv) +
        '<div class="swc-btnrow">' +
          '<button class="swc-btn primary" id="swcCsvImport" ' + (needsMore ? "disabled" : "") + '>Import &amp; enrich ' + csv.rows.length + ' rows</button>' +
          '<button class="swc-btn ghost" id="swcCsvReset">Choose a different file</button>' +
        '</div>' +
        (needsMore ? '<p style="margin-top:8px;font-size:11.5px;color:var(--text-faint);">Map at least Account name and Email to continue.</p>' : "");
    } else {
      body = '<label class="swc-dropzone" for="swcCsvInput">Drag &amp; drop a CSV, or click to upload your own accounts and contacts. We&#8217;ll enrich them the same way.<input type="file" id="swcCsvInput" accept=".csv" /></label>';
    }
    return '<div class="swc-section"><div class="swc-section-label">Bring your own data</div>' + body + '</div>';
  }
  function csvPreviewTableHtml(csv) {
    var cols = CSV_FIELDS.map(function (f) { return csv.mapping[f.key]; });
    var previewRows = csv.rows.slice(0, 3);
    return '<div class="swc-csvpreview"><table><thead><tr>' + CSV_FIELDS.map(function (f) { return "<th>" + f.label + "</th>"; }).join("") + '</tr></thead><tbody>' +
      previewRows.map(function (r) {
        return "<tr>" + cols.map(function (ci) { return "<td>" + (ci >= 0 && r[ci] !== undefined ? escapeHtml(r[ci]) : "—") + "</td>"; }).join("") + "</tr>";
      }).join("") + '</tbody></table></div>';
  }

  function closingCopy() {
    var fn = firstName(), agent = state.agentName || "Your agent";
    return (fn ? ("Nice work, " + fn + ".") : "Nice work.") + " " + agent + " is live and watching. Come back anytime — none of this goes away.";
  }
  function escapeHtml(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

  /* ---------------- MOUNT + WIRE ---------------- */
  function renderStage() {
    var key = STAGES[state.stage - 1].key;
    var stageEl = document.getElementById("swcStage");
    stageEl.classList.toggle("is-wide", key === "value");
    stageEl.innerHTML = RENDERERS[key]();
    wireNav();
    wireStage(key);
    renderDots();
    renderGetStarted();
  }

  function wireNav() {
    var back = document.getElementById("swcBackBtn"), next = document.getElementById("swcNextBtn");
    if (back) back.addEventListener("click", function () { if (state.stage > 1) goToStage(state.stage - 1); });
    if (next) next.addEventListener("click", function () { if (state.stage < STAGE_COUNT) goToStage(state.stage + 1); });
  }

  function wireStage(key) {
    if (key === "signup") {
      var introTyped = state._signupIntroDone;
      document.querySelectorAll("[data-sso]").forEach(function (b) {
        b.addEventListener("click", function () { markDone("signup", "email"); refreshChrome(); });
      });
      var nameInput = document.getElementById("swcName");
      nameInput.addEventListener("input", function () { state.name = nameInput.value; });
      var emailInput = document.getElementById("swcEmail");
      emailInput.addEventListener("input", function () {
        if (emailInput.value.includes("@")) markDone("signup", "email"); else unmarkDone("signup", "email");
        refreshChrome();
      });
      document.querySelectorAll("[data-role]").forEach(function (b) {
        b.addEventListener("click", function () {
          state.role = b.dataset.role;
          document.querySelectorAll("[data-role]").forEach(function (x) { x.classList.remove("is-selected"); });
          b.classList.add("is-selected");
          markDone("signup", "role"); refreshChrome();
        });
      });
    }

    if (key === "firstrun") {
      document.querySelectorAll("[data-obj]").forEach(function (b) {
        b.addEventListener("click", function () {
          state.objective = b.dataset.obj;
          document.querySelectorAll("[data-obj]").forEach(function (x) { x.classList.remove("is-selected"); });
          b.classList.add("is-selected");
          markDone("firstrun", "objective"); refreshChrome();
        });
      });
      document.getElementById("swcWorkspace").addEventListener("input", function () { markDone("firstrun", "workspace"); refreshChrome(); });
    }

    if (key === "agent") {
      var introBubble = document.getElementById("swcIntroBubble");
      if (introBubble) {
        if (state._agentIntroTyped) introBubble.textContent = introMsg();
        else { typeText(introBubble, introMsg(), 14); state._agentIntroTyped = true; }
      }
      var icpBox = document.getElementById("swcIcpText");
      if (icpBox) icpBox.addEventListener("input", function () { state.icpDraft = icpBox.value; });
      document.querySelectorAll("[data-icpchip]").forEach(function (b) {
        b.addEventListener("click", function () {
          var c = b.dataset.icpchip;
          state.icpChipsUsed[c] = !state.icpChipsUsed[c];
          b.classList.toggle("is-selected");
          if (icpBox && !icpBox.value.trim()) icpBox.value = Object.keys(state.icpChipsUsed).filter(function (k) { return state.icpChipsUsed[k]; }).join(", ");
          state.icpDraft = icpBox ? icpBox.value : state.icpDraft;
        });
      });
      var send = document.getElementById("swcSendIcp");
      if (send) send.addEventListener("click", submitIcp);
      if (icpBox) icpBox.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitIcp(); } });

      var reasonToggle = document.getElementById("swcReasoningToggle");
      if (reasonToggle) reasonToggle.addEventListener("click", function () { state.reasoningOpen = !state.reasoningOpen; renderStage(); });
      var icpNameInput = document.getElementById("swcIcpNameInput");
      if (icpNameInput) icpNameInput.addEventListener("input", function () { state.icpName = icpNameInput.value; });
      var agentNameInput = document.getElementById("swcAgentNameInput");
      if (agentNameInput) agentNameInput.addEventListener("input", function () { state.agentName = agentNameInput.value; });
      var editIcp = document.getElementById("swcEditIcp");
      if (editIcp) editIcp.addEventListener("click", function () { state.icpSubmitted = false; state.agentReplyShown = false; renderStage(); });
      var save = document.getElementById("swcSaveAgent");
      if (save) save.addEventListener("click", function () {
        if (!state.agentName && agentNameInput) state.agentName = agentNameInput.value;
        if (!state.agentSaved) { state.agentSaved = true; markDone("agent", "save"); addCredits(75); }
        renderStage();
      });
    }

    if (key === "value") {
      document.querySelectorAll("[data-askrun]").forEach(function (b) {
        b.addEventListener("click", function () { state.confirmRunAgent = true; renderStage(); });
      });
      document.querySelectorAll("[data-cancelrun]").forEach(function (b) {
        b.addEventListener("click", function () { state.confirmRunAgent = false; renderStage(); });
      });
      document.querySelectorAll("[data-confirmrun]").forEach(function (b) {
        b.addEventListener("click", function () {
          state.confirmRunAgent = false;
          state.valueSearching = true; renderStage();
          setTimeout(function () {
            state.valueSearching = false; state.valueRevealed = true;
            state.selectedAccountId = firstMatchedId();
            state.selectedContactId = primaryContactId(accountById(state.selectedAccountId));
            markDone("value", "revealed"); addCredits(100);
            renderStage(); refreshChrome();
          }, 750);
        });
      });
      document.querySelectorAll("[data-selectacct]").forEach(function (b) {
        b.addEventListener("click", function () {
          state.selectedAccountId = b.dataset.selectacct;
          state.selectedContactId = primaryContactId(accountById(state.selectedAccountId));
          renderStage();
        });
      });
      document.querySelectorAll("[data-selectcontact]").forEach(function (b) {
        b.addEventListener("click", function () { state.selectedContactId = b.dataset.selectcontact; renderStage(); });
      });
      document.querySelectorAll("[data-confid]").forEach(function (b) {
        b.addEventListener("click", function () { var id = b.dataset.confid; state.confidenceOpen[id] = !state.confidenceOpen[id]; renderStage(); });
      });
      document.querySelectorAll("[data-quickcrm]").forEach(function (b) {
        b.addEventListener("click", function () { state.crm[b.dataset.quickcrm] = true; renderStage(); refreshChrome(); });
      });
      var libToggle = document.getElementById("swcAgentsLibToggle");
      if (libToggle) libToggle.addEventListener("click", function () { state.agentsLibraryOpen = !state.agentsLibraryOpen; renderStage(); });
      document.querySelectorAll("[data-uselib]").forEach(function (b) {
        b.addEventListener("click", function () { goToStage(3); });
      });
      var pv = document.getElementById("swcPreviewOnlyBtn");
      if (pv) pv.addEventListener("click", function () { state.previewOnly = true; renderStage(); });
      var push = document.getElementById("swcPushBtn");
      if (push) push.addEventListener("click", function () { state.pushedToCrm = true; renderStage(); });

      document.querySelectorAll("[data-asksignals]").forEach(function (b) {
        b.addEventListener("click", function () { state.signalsConfirm[b.dataset.asksignals] = true; renderStage(); });
      });
      document.querySelectorAll("[data-cancelsignals]").forEach(function (b) {
        b.addEventListener("click", function () { state.signalsConfirm[b.dataset.cancelsignals] = false; renderStage(); });
      });
      document.querySelectorAll("[data-confirmsignals]").forEach(function (b) {
        b.addEventListener("click", function () {
          var id = b.dataset.confirmsignals;
          state.signalsConfirm[id] = false; state.signalsGenerating[id] = true; renderStage();
          setTimeout(function () { state.signalsGenerating[id] = false; state.signalsShown[id] = true; addCredits(15); renderStage(); }, 700);
        });
      });
      document.querySelectorAll("[data-enrich]").forEach(function (b) {
        b.addEventListener("click", function () {
          var cid = b.dataset.cid, field = b.dataset.enrich;
          b.textContent = "…"; b.disabled = true;
          setTimeout(function () {
            if (field === "email") state.enrichedEmail[cid] = true; else state.enrichedPhone[cid] = true;
            addCredits(5);
            renderStage();
          }, 500);
        });
      });
      document.querySelectorAll("[data-hpmtmpl]").forEach(function (b) {
        b.addEventListener("click", function () {
          var cid = b.dataset.cid;
          state.hpmTemplate[cid] = b.dataset.hpmtmpl;
          if (state.hpmText[cid]) delete state.hpmText[cid].s1;
          renderStage();
        });
      });
      document.querySelectorAll("[data-cadgen]").forEach(function (b) {
        b.addEventListener("click", function () {
          var cid = b.dataset.cid, sid = b.dataset.step;
          var contact = findContact(cid);
          if (!state.hpmGenerating[cid]) state.hpmGenerating[cid] = {};
          state.hpmGenerating[cid][sid] = true; renderStage();
          setTimeout(function () {
            state.hpmGenerating[cid][sid] = false;
            if (!state.hpmText[cid]) state.hpmText[cid] = {};
            state.hpmText[cid][sid] = cadenceStepMessage(contact, sid);
            addCredits(10);
            renderStage();
          }, 650);
        });
      });
      document.querySelectorAll("[data-cadqueue]").forEach(function (b) {
        b.addEventListener("click", function () {
          if (b.disabled) return;
          var cid = b.dataset.cid, sid = b.dataset.step;
          if (!state.outreachSent[cid]) state.outreachSent[cid] = {};
          state.outreachSent[cid][sid] = true;
          renderStage();
        });
      });
      document.querySelectorAll("[data-gapinc]").forEach(function (b) {
        b.addEventListener("click", function () {
          var cid = b.dataset.cid, key = b.dataset.gapkey, def = key === "s1_s2" ? 3 : 4;
          if (!state.cadenceGap[cid]) state.cadenceGap[cid] = {};
          var cur = state.cadenceGap[cid][key] || def;
          state.cadenceGap[cid][key] = Math.min(14, cur + 1);
          renderStage();
        });
      });
      document.querySelectorAll("[data-gapdec]").forEach(function (b) {
        b.addEventListener("click", function () {
          var cid = b.dataset.cid, key = b.dataset.gapkey, def = key === "s1_s2" ? 3 : 4;
          if (!state.cadenceGap[cid]) state.cadenceGap[cid] = {};
          var cur = state.cadenceGap[cid][key] || def;
          state.cadenceGap[cid][key] = Math.max(1, cur - 1);
          renderStage();
        });
      });
      var csvInput = document.getElementById("swcCsvInput");
      if (csvInput) csvInput.addEventListener("change", function () {
        if (!csvInput.files || !csvInput.files[0]) return;
        var file = csvInput.files[0];
        var reader = new FileReader();
        reader.onload = function (e) {
          var parsed = parseCsv(String(e.target.result || ""));
          if (!parsed || parsed.headers.length < 2 || !parsed.rows.length) {
            state.csv = { fileName: file.name, headers: null, rows: [], totalRows: 0, mapping: {}, error: "We couldn't detect columns in this file, make sure it's a CSV with a header row and at least one data row.", importing: false, imported: false };
          } else {
            state.csv = { fileName: file.name, headers: parsed.headers, rows: parsed.rows, totalRows: parsed.rows.length, mapping: guessMapping(parsed.headers), error: null, importing: false, imported: false };
          }
          renderStage();
        };
        reader.readAsText(file);
      });
      document.querySelectorAll("[data-csvmap]").forEach(function (sel) {
        sel.addEventListener("change", function () { state.csv.mapping[sel.dataset.csvmap] = parseInt(sel.value, 10); renderStage(); });
      });
      var csvReset = document.getElementById("swcCsvReset");
      if (csvReset) csvReset.addEventListener("click", function () {
        state.csv = { fileName: "", headers: null, rows: [], totalRows: 0, mapping: {}, error: null, importing: false, imported: false };
        renderStage();
      });
      var csvImportBtn = document.getElementById("swcCsvImport");
      if (csvImportBtn) csvImportBtn.addEventListener("click", function () {
        if (csvImportBtn.disabled) return;
        state.csv.importing = true; renderStage();
        setTimeout(function () {
          state.csv.importing = false; state.csv.imported = true;
          addCredits(state.csv.totalRows * 2);
          renderStage();
        }, 900);
      });
    }

    if (key === "configure") {
      var toggle = document.getElementById("swcCrmToggle");
      if (toggle) toggle.addEventListener("click", function () { state.crmGridOpen = !state.crmGridOpen; renderStage(); });
      document.querySelectorAll("[data-crmconnect]").forEach(function (b) {
        b.addEventListener("click", function () { var c = b.dataset.crmconnect; state.crm[c] = !state.crm[c]; renderStage(); refreshChrome(); });
      });
    }
  }

  function introMsg() {
    var fn = firstName();
    return (fn ? ("Hey " + fn + " — ") : "Hey — ") + "tell me about the accounts you want to track. Rough ideas are totally fine, I'll tighten it up with you.";
  }
  function submitIcp() {
    var icpBox = document.getElementById("swcIcpText");
    var text = (icpBox ? icpBox.value : state.icpDraft || "").trim();
    if (!text) return;
    state.icpText = text; state.icpSubmitted = true;
    state.agentReasoningShown = false; state.reasoningOpen = true; state.agentReplyShown = false;
    renderStage();
    setTimeout(function () { state.agentReasoningShown = true; renderStage(); }, 800);
    setTimeout(function () { state.agentReplyShown = true; state.reasoningOpen = false; renderStage(); }, 2100);
  }

  /* ---------------- LIVE PARTICLE NETWORK BACKGROUND ---------------- */
  function initParticles() {
    var canvas = document.getElementById("swcParticleCanvas");
    if (!canvas || !canvas.getContext) return;
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) return;
    var ctx = canvas.getContext("2d");
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    var COLORS = ["139,124,255", "52,224,176", "255,110,196"];
    var COUNT = 46, LINK_DIST = 130 * DPR;
    var W, H, particles = [], mouse = { x: null, y: null };

    function resize() {
      W = canvas.width = window.innerWidth * DPR;
      H = canvas.height = window.innerHeight * DPR;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
    }
    function spawn() {
      particles = [];
      for (var i = 0; i < COUNT; i++) {
        particles.push({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.4 * DPR, vy: (Math.random() - 0.5) * 0.4 * DPR,
          r: (Math.random() * 1.6 + 0.9) * DPR, c: COLORS[i % COLORS.length]
        });
      }
    }
    resize(); spawn();
    window.addEventListener("resize", function () { resize(); spawn(); });
    window.addEventListener("mousemove", function (e) { mouse.x = e.clientX * DPR; mouse.y = e.clientY * DPR; });
    window.addEventListener("mouseleave", function () { mouse.x = null; mouse.y = null; });

    function step() {
      if (!W || !H) { requestAnimationFrame(step); return; }
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        if (mouse.x != null) {
          var dx = p.x - mouse.x, dy = p.y - mouse.y, dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 150 * DPR && dist > 0.01) {
            var force = (1 - dist / (150 * DPR)) * 0.7;
            p.x += (dx / dist) * force; p.y += (dy / dist) * force;
          }
        }
      }
      for (var i = 0; i < particles.length; i++) {
        for (var j = i + 1; j < particles.length; j++) {
          var a = particles[i], b = particles[j];
          var dx = a.x - b.x, dy = a.y - b.y, dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < LINK_DIST) {
            ctx.strokeStyle = "rgba(" + a.c + "," + ((1 - dist / LINK_DIST) * 0.2) + ")";
            ctx.lineWidth = DPR;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        ctx.beginPath();
        ctx.fillStyle = "rgba(" + p.c + ",0.9)";
        ctx.shadowColor = "rgba(" + p.c + ",0.9)";
        ctx.shadowBlur = 6 * DPR;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function refreshChrome() { renderDots(); renderGetStarted(); }

  function goToStage(n) { state.stage = n; renderStage(); document.querySelector(".swc-stagewrap").scrollTop = 0; }
  document.getElementById("swcExit").addEventListener("click", function () { goToStage(1); });

  document.addEventListener("click", function (e) {
    var wrap = document.getElementById("swcGetStarted");
    if (wrap && state.getStartedOpen && !wrap.contains(e.target)) { state.getStartedOpen = false; renderGetStarted(); }
  });

  renderDots();
  renderGetStarted();
  renderStage();
  initParticles();
})();
</script>
